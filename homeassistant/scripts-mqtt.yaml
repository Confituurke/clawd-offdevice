# For the n8n brain (push or view mode) over MQTT: no rest_command and no HA
# restart needed. Merge into your scripts.yaml instead of scripts.yaml's
# rest_command versions; the script names are the same, so lovelace-card.yaml
# works unchanged. n8n applies the action and brings Clawd on screen, like the
# webhook. The topic must match HA_TOPIC in the workflow's Settings node
# (not clawd/cmd, which is the clock's own).

clawd_feed:
  alias: "Clawd füttern"
  icon: mdi:food-drumstick
  sequence:
    - action: mqtt.publish
      data: { topic: clawd/ha, payload: feed }
clawd_play:
  alias: "Clawd spielen"
  icon: mdi:tennis-ball
  sequence:
    - action: mqtt.publish
      data: { topic: clawd/ha, payload: play }
clawd_clean:
